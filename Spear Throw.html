<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spear Throw</title>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9dfc0;--panel:#f6efd8;--ink:#2a3029;--line:#b9a97a;--gold:#c58f12;--acc:#2f7d6d;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b221e;--panel:#27312b;--ink:#efe6c9;--line:#47554a;--gold:#e6b43a;--acc:#4fae99;--accink:#10201b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b221e;--panel:#27312b;--ink:#efe6c9;--line:#47554a;--gold:#e6b43a;--acc:#4fae99;--accink:#10201b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Alegreya Sans',system-ui,sans-serif;font-weight:500;font-size:17px}
body{padding:10px;max-width:860px;margin:0 auto}
#hud{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#hud span{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:3px 10px;white-space:nowrap}
#hud b{font-weight:800}
#stage{position:relative;border:3px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:auto;aspect-ratio:8/5;touch-action:none}
#ov,#panel{display:none;position:absolute;inset:0}
#ov.on{display:block;pointer-events:none}
#ov>*{pointer-events:auto}
#panel.on{display:block;background:color-mix(in srgb,var(--bg) 92%,transparent);overflow:auto;padding:14px}
#top{position:absolute;top:10px;left:0;right:0;text-align:center}
#top h2{margin:0;font-size:26px;font-weight:800;color:#fff;text-shadow:0 2px 0 #0007}
#res{font-size:24px;font-weight:800;color:#ffe48a;text-shadow:0 2px 0 #0008;min-height:30px}
#mw{position:absolute;left:8%;right:8%;bottom:70px}
#meter{position:relative;height:34px;background:#222;border:3px solid #fff;border-radius:8px;overflow:hidden}
#meter div{position:absolute;top:0;bottom:0}
#zo{background:#7a8f3a}#zg{background:#e0b83a}#zp{background:#fff}
#mk{width:6px;background:#e0433a;margin-left:-3px;box-shadow:0 0 0 2px #0006}
#bot{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:10px;justify-content:center}
button{font:inherit;font-weight:800;background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:8px 18px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.alt{background:var(--panel);color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#stop{font-size:22px;padding:10px 40px}
#bar{display:flex;align-items:center;gap:10px;margin-top:8px;min-height:44px;flex-wrap:wrap}
#hint{opacity:.75;font-size:15px;margin-top:6px}
.row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.row b{flex:1}.row span{opacity:.8}
#panel h2{margin:0 0 6px}
#panel p{margin:6px 0}
</style></head><body>
<div id="hud"></div>
<div id="stage">
<canvas id="c" width="800" height="500"></canvas>
<div id="ov">
<div id="top"><h2 id="ottl"></h2><div id="res"></div></div>
<div id="mw"><div id="meter"><div id="zo"></div><div id="zg"></div><div id="zp"></div><div id="mk"></div></div></div>
<div id="bot"><button id="stop">Stop!</button><button id="again" class="alt" style="display:none">Throw again</button><button id="leave" class="alt">Leave</button></div>
</div>
<div id="panel"></div>
</div>
<div id="bar"><button id="act" style="display:none"></button><button id="reset" class="alt" style="margin-left:auto">Reset progress</button></div>
<div id="hint">Move: WASD / arrows, or tap the ground. Interact: E or the button. Stop the meter with Space or Stop!, aiming for the white zone.</div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),W=1200,H=800;
const SP=[["Wooden Spear",1,0,'point','#b98d52',0,0],["Flint Spear",1.7,250,'leaf','#9aa0a6',0,0],["Bone Harpoon",2.6,1200,'barb','#eee6d0',0,0],["Bronze Spear",4,5000,'leaf','#cd8f3a',0,0],["Iron Trident",7,22000,'trident','#b9c0c8',0,0],
["Icicle Dart",12,6e4,'point','#d6f2ff',0,1],["Frostfang",20,2.5e5,'diamond','#bfe9ff','#8fdcff',1],["Yeti Bonebarb",34,1e6,'barb','#f1f1f1',0,1],["Aurora Lance",55,4e6,'crescent','#6dffd0','#6dffc0',1],["Glacier Trident",90,1.6e7,'trident','#9ad0ff','#7ac0ff',1],
["Obsidian Lance",150,6e7,'diamond','#2a2438','#a05cff',2],["Magma Spike",250,2.5e8,'leaf','#ff7a2a','#ff5a1a',2],["Sunfire Spear",400,1e9,'flame','#ffb020','#ff6a1a',2],["Thunder Pike",650,4e9,'bolt','#fff27a','#ffe83a',2],["Inferno Reaper",1000,1.6e10,'crescent','#c0201a','#ff3a1a',2],
["Cloud Dart",1600,7e10,'point','#ffffff','#d0e0ff',3],["Jade Glaive",2600,3e11,'crescent','#3fbf8a','#6dffc0',3],["Void Reaper",4200,1.2e12,'crescent','#1a1030','#c13cff',3],["Comet Spear",7000,5e12,'star','#ffe9a0','#ffd060',3],["Starfall",12000,2e13,'star','#ffffff','#7fb0ff',3],["Gold Gem Spear",30000,0,'gem','#ffd23a','#ffd23a',-1]];
const WD=[{n:"Greenlands",need:0,g:'grass',pl:'sand',sky:['#8ec5d6','#e8e2b8'],hill:['#7a9f7c','#86ad86'],tree:'oak'},{n:"Frostpeak",need:3000,g:'snow',pl:'ice',sky:['#9db8d8','#eef4fb'],hill:['#b9c9dc','#cdd9e8'],tree:'pine'},{n:"Ember Wastes",need:60000,g:'ash',pl:'lava',sky:['#4a1f1a','#d9692a'],hill:['#3a2220','#4a2a24'],tree:'dead'},{n:"Sky Realm",need:1.5e6,g:'cloud',pl:'gold',sky:['#2a1f5a','#c68be8'],hill:['#6a58b0','#8070c8'],tree:'crystal'}];
const IT=[
{t:'st',n:"Push-ups",x:190,y:200,b:1,lv:1,sp:.7,c:'#5b8c5a'},
{t:'st',n:"Boulder lift",x:190,y:400,b:5,lv:3,sp:.95,c:'#7d858c'},
{t:'st',n:"Spear drills",x:190,y:600,b:25,lv:6,sp:1.2,c:'#b5842f'},
{t:'throw',n:"Throwing line",x:600,y:120},
{t:'shop',n:"Spear shop",x:1010,y:300},
{t:'reb',n:"Rebirth altar",x:600,y:690},
{t:'tp',n:"Teleporter",x:600,y:400},
{t:'tree',n:"Strange tree",x:1110,y:95}];
const Q=['Miss','OK','Good','Perfect!'];
let S=(()=>{try{return JSON.parse(localStorage.getItem('spear-throw-2'))}catch(e){return null}})()||{money:0,power:0,reb:0,spear:0,owned:[0],w:0,best:[0,0,0,0]};
const save=()=>{try{localStorage.setItem('spear-throw-2',JSON.stringify(S))}catch(e){}};
const fmt=n=>{n=Math.floor(n);if(n<1000)return''+n;const u=['K','M','B','T'];let i=-1;while(n>=1000&&i<3){n/=1000;i++}return(n<10?n.toFixed(2):n<100?n.toFixed(1):n.toFixed(0))+u[i]};
const lvl=p=>1+Math.floor(Math.sqrt(p/50)),need=l=>50*(l-1)**2;
const tier=()=>1+Math.floor(S.reb/2),mm=()=>1+.5*S.reb,rebLv=()=>8+2*S.reb;
function hud(){const l=lvl(S.power);$('hud').innerHTML=`<span>Money <b>$${fmt(S.money)}</b></span><span>Power <b>${fmt(S.power)}</b></span><span>Level <b>${l}</b> (${fmt(S.power)}/${fmt(need(l+1))})</span><span>Rebirths <b>${S.reb}</b></span><span>Training <b>${tier()}x</b></span><span>Money <b>${mm()}x</b></span><span>${WD[S.w].n}</span><span>Best <b>${fmtD(S.best[S.w])}</b></span><span>${SP[S.spear][0]}</span>`}
let mode='world',cur=null,M=null,fly=null,P={x:600,y:540,a:0},tg=null,keys={};
// meter
function zone(id,c,w){const e=$(id);e.style.left=(c-w)*100+'%';e.style.width=w*200+'%'}
function startMeter(speed,cb){const c=.28+Math.random()*.44;M={c,speed,t0:performance.now(),cb,pos:0};zone('zo',c,.25);zone('zg',c,.12);zone('zp',c,.04);$('mw').style.display='';$('stop').style.display=''}
function hit(){if(!M)return;const d=Math.abs(M.pos-M.c),q=d<.04?3:d<.12?2:d<.25?1:0,m=M;M=null;if(q==3){burst(110,345,36,'#ffe48a',260);shake=10}else if(q==2)burst(110,345,14,'#fff',160);$('mw').style.display='none';$('stop').style.display='none';m.cb(q)}
// training
function openTrain(s){mode='train';cur=s;$('ov').className='on';$('ottl').textContent=s.n+' ('+s.b*tier()+' power per hit)';$('res').textContent='';$('again').style.display='none';round()}
function round(){if(mode!=='train')return;startMeter(cur.sp,q=>{const g=cur.b*tier()*q;S.power+=g;save();hud();$('res').textContent=Q[q]+(g?'  +'+fmt(g)+' power':'');setTimeout(round,650)})}
// throwing
function openThrow(){mode='throw';fly=null;$('ov').className='on';$('ottl').textContent='Throwing line';$('res').textContent='';$('again').style.display='none';
startMeter(.9,q=>{const d=(8+S.power*.12)*SP[S.spear][1]*[.5,1,1.25,1.6][q];fly={d,q,t:0,m:Math.ceil(d*5*mm()),done:false};mode='fly';$('res').textContent=Q[q]})}
function finishFly(){if(!fly||fly.done)return;fly.done=true;S.money+=fly.m;const nw=S.w<3&&S.best[S.w]<WD[S.w+1].need&&fly.d>=WD[S.w+1].need;S.best[S.w]=Math.max(S.best[S.w],fly.d);save();hud();$('res').textContent=fmtD(fly.d)+'  +$'+fmt(fly.m)+(nw?'  Unlocked '+WD[S.w+1].n+'!':'');$('again').style.display=''}
function leave(){if(mode==='fly')finishFly();M=null;mode='world';$('ov').className='';$('panel').className='';$('mw').style.display='none'}
$('stop').onclick=hit;$('leave').onclick=leave;$('again').onclick=openThrow;
// panels
function shop(){mode='panel';$('panel').className='on';let h='<h2>Spear shop: '+WD[S.w].n+'</h2><p>Each world sells its own spears. Better spears throw farther, which pays more.</p>';
SP.forEach((s,i)=>{if(s[6]!==S.w&&!(s[6]<0&&S.owned.includes(i)))return;const o=S.owned.includes(i);h+=`<div class="row"><canvas width="110" height="30" data-i="${i}"></canvas><b>${s[0]}</b><span>${s[1]}x distance</span>`+(o?(S.spear===i?'<span>Equipped</span>':`<button data-eq="${i}">Equip</button>`):`<button data-buy="${i}" ${S.money<s[2]?'disabled':''}>Buy $${fmt(s[2])}</button>`)+'</div>'});
$('panel').innerHTML=h+'<p><button class="alt" data-close>Close</button></p>';$('panel').querySelectorAll('canvas').forEach(k=>{const x=k.getContext('2d');x.translate(55,15);drawSpear(x,+k.dataset.i,100)})}
function reb(){mode='panel';$('panel').className='on';const l=lvl(S.power),ok=l>=rebLv(),n=S.reb+1;
$('panel').innerHTML=`<h2>Rebirth altar</h2><p>Reach level <b>${rebLv()}</b> (you are level ${l}). Rebirth resets your money, power and spears.</p><p>Rebirth ${n} gives: money ${1+.5*n}x${n%2==0?`, and training stations up to <b>${1+n/2}x</b>`:''}.</p><p>Training bonus: 2x at rebirth 2, 3x at rebirth 4, 4x at rebirth 6, and so on.</p><p><button data-reb ${ok?'':'disabled'}>Rebirth</button> <button class="alt" data-close>Close</button></p>`}
$('panel').onclick=e=>{const d=e.target.dataset;if(!d)return;
if('buy'in d){const i=+d.buy;if(S.money>=SP[i][2]){S.money-=SP[i][2];S.owned.push(i);S.spear=i;save();hud();shop()}}
else if('eq'in d){S.spear=+d.eq;save();hud();shop()}
else if('reb'in d){S.reb++;S.money=0;S.power=0;{const k=S.owned.includes(20);S.spear=k?20:0;S.owned=k?[0,20]:[0]}save();hud();reb()}
else if('go'in d){S.w=+d.go;P.x=600;P.y=540;save();hud();leave()}
else if('close'in d)leave()};
// interaction
function near(){let b=null,bd=90;for(const i of IT){const d=Math.hypot(i.x-P.x,i.y-P.y);if(d<bd){bd=d;b=i}}return b}
function act(){if(mode!=='world')return;const i=near();if(!i)return;
if(i.t==='st'){if(lvl(S.power)>=i.lv)openTrain(i)}else if(i.t==='throw')openThrow();else if(i.t==='shop')shop();else if(i.t==='tp')tp();else if(i.t==='tree')giveGem();else reb()}
$('act').onclick=act;
let lastTxt='';
function actBtn(){const n0=mode==='world'?near():null,i=n0&&n0.t==='tree'?null:n0,b=$('act');if(!i){b.style.display='none';lastTxt='';return}
const lock=i.t==='st'&&lvl(S.power)<i.lv,t=lock?`${i.n}: reach level ${i.lv}`:`${i.t==='st'?'Train: ':''}${i.n} (E)`;
if(t!==lastTxt){b.textContent=t;b.disabled=lock;lastTxt=t}b.style.display=''}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(mode==='cut'){e.preventDefault();endCut();return}
if(k===' '||k==='enter'){if(M){e.preventDefault();hit()}else if(mode==='fly'&&fly&&fly.done&&k===' ')openThrow()}
else if(k==='e')act();else if(k==='escape')leave();else keys[k]=1});
addEventListener('keyup',e=>delete keys[e.key.toLowerCase()]);
cv.addEventListener('pointerdown',e=>{if(mode==='cut'){endCut();return}if(mode!=='world')return;const r=cv.getBoundingClientRect(),s=800/r.width;tg={x:cam().x+(e.clientX-r.left)*s,y:cam().y+(e.clientY-r.top)*s};const tr=IT.find(i=>i.t==='tree');if(tr&&near()===tr&&Math.hypot(tg.x-tr.x,tg.y-tr.y+20)<55){tg=null;giveGem()}});
const cam=()=>({x:Math.max(0,Math.min(W-800,P.x-400)),y:Math.max(0,Math.min(H-500,P.y-250))});
// draw
const tufts=Array.from({length:90},(_,i)=>[(i*379)%W,(i*617)%H]);
function tex(base,dots,n,sz){const k=document.createElement('canvas');k.width=k.height=128;const x=k.getContext('2d');x.fillStyle=base;x.fillRect(0,0,128,128);for(let i=0;i<n;i++){x.fillStyle=dots[i%dots.length];const s=1+Math.random()*sz;x.fillRect(Math.random()*128,Math.random()*128,s*2,s)}return ctx.createPattern(k,'repeat')}
const T={grass:tex('#6f8f55',['#5f8048','#7da05f','#587a42'],800,3),sand:tex('#d8c690',['#c9b57c','#e6d8a8','#bfa96e'],600,2),stone:tex('#7d858c',['#6b7379','#8f979e','#5c6368'],500,3),wood:tex('#8b6a3d',['#7a5b32','#9a7a4a','#6a4c28','#5a3d22'],500,4),dirt:tex('#b99c5a',['#a88b4c','#c8ad6a','#977b40'],600,3)};
Object.assign(T,{snow:tex('#e9f0f7',['#d3dfec','#ffffff','#c3d3e4'],700,2),ice:tex('#a9d4ee',['#8fc2e2','#c8e8f8','#7ab0d4'],500,3),ash:tex('#4a423f',['#3a3432','#5d5350','#2c2725'],800,3),lava:tex('#a8321c',['#ff8a2a','#7a1e10','#ffb04a'],600,3),cloud:tex('#a99ad8',['#bfb2ea','#9486c8','#d6ccf5'],800,3),gold:tex('#d9b24a',['#f0cc6a','#b8923a','#fbe28f'],500,2)});
const fmtD=d=>d>=1000?fmt(d)+' m':d.toFixed(1)+' m';
function tree(x,y,t){ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(x,y+10,22,7,0,0,7);ctx.fill();
if(t=='oak'){ctx.fillStyle='#5a3d22';ctx.fillRect(x-4,y-6,8,16);ctx.fillStyle='#3f6a3a';ctx.beginPath();ctx.arc(x,y-16,20,0,7);ctx.fill();ctx.fillStyle='#4c7c45';ctx.beginPath();ctx.arc(x-6,y-22,12,0,7);ctx.fill()}
else if(t=='pine'){ctx.fillStyle='#5a3d22';ctx.fillRect(x-3,y-4,6,14);[['#2f5a45',24,-8],['#3a6b52',19,-22],['#477d60',13,-34]].forEach(a=>{ctx.fillStyle=a[0];ctx.beginPath();ctx.moveTo(x-a[1],y+a[2]+10);ctx.lineTo(x,y+a[2]-16);ctx.lineTo(x+a[1],y+a[2]+10);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x-a[1]*.4,y+a[2]-10,a[1]*.8,3)})}
else if(t=='dead'){ctx.strokeStyle='#1c1412';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y+10);ctx.lineTo(x,y-26);ctx.moveTo(x,y-8);ctx.lineTo(x-14,y-22);ctx.moveTo(x,y-16);ctx.lineTo(x+13,y-30);ctx.stroke()}
else{ctx.shadowColor='#c9a8ff';ctx.shadowBlur=12;[[-10,-18,'#9a6bff'],[0,-30,'#6bd6ff'],[10,-16,'#c98bff']].forEach(a=>{ctx.fillStyle=a[2];ctx.beginPath();ctx.moveTo(x+a[0]-5,y+8);ctx.lineTo(x+a[0],y+a[1]);ctx.lineTo(x+a[0]+5,y+8);ctx.fill()});ctx.shadowBlur=0}}
function stIcon(b,l){ctx.save();ctx.globalAlpha=l?.4:1;ctx.lineCap='round';
if(b==1){ctx.fillStyle='#3d6fb0';ctx.fillRect(-52,-24,104,48);ctx.fillStyle='#e8c9a0';ctx.beginPath();ctx.arc(-30,-8,7,0,7);ctx.fill();ctx.strokeStyle='#2f7d6d';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-24,-4);ctx.lineTo(30,6);ctx.stroke();ctx.lineWidth=4;ctx.strokeStyle='#e8c9a0';ctx.beginPath();ctx.moveTo(-14,-2);ctx.lineTo(-14,14);ctx.moveTo(28,6);ctx.lineTo(34,14);ctx.stroke()}
else if(b==5){ctx.fillStyle='#8a9096';ctx.beginPath();ctx.ellipse(0,4,42,28,0,0,7);ctx.fill();ctx.strokeStyle='#0006';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#b0b5ba';ctx.beginPath();ctx.ellipse(-10,-5,18,10,0,0,7);ctx.fill()}
else{ctx.fillStyle='#6e4522';ctx.fillRect(-4,-22,8,52);['#fff','#d33','#fff','#d33'].forEach((c,j)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,-8,24-j*6,0,7);ctx.fill()});ctx.strokeStyle='#8a5a2b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(14,-14);ctx.lineTo(-6,-8);ctx.stroke()}ctx.restore()}
function drawTp(){const t=performance.now()/1000;ctx.fillStyle=T.stone;ctx.beginPath();ctx.arc(0,0,60,0,7);ctx.fill();ctx.strokeStyle='#0006';ctx.lineWidth=3;ctx.stroke();
const g=ctx.createRadialGradient(0,0,4,0,0,46);g.addColorStop(0,'#fff');g.addColorStop(.5,'#9a6bff');g.addColorStop(1,'#2a1a5a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,46,0,7);ctx.fill();
ctx.lineWidth=4;for(let k=0;k<3;k++){ctx.strokeStyle='rgba(255,255,255,'+(.8-k*.25)+')';const r=40-k*11;ctx.beginPath();ctx.ellipse(0,0,r,r*.5,t*(k%2?-2:2)+k,0,5);ctx.stroke()}
for(let k=0;k<6;k++){const a=k*1.047;ctx.fillStyle='#c9a8ff';ctx.fillRect(Math.cos(a)*60-5,Math.sin(a)*60-5,10,10)}label('Teleporter',0,86)}
function drawPlayer(){const m=tg||keys.w||keys.a||keys.s||keys.d||keys.arrowup||keys.arrowleft||keys.arrowdown||keys.arrowright,w=m?Math.sin(performance.now()/90)*4:0,x=P.x,y=P.y;
ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(x,y+15,16,6,0,0,7);ctx.fill();ctx.fillStyle='#3a2a18';ctx.fillRect(x-8,y+4,6,10+w);ctx.fillRect(x+2,y+4,6,10-w);
ctx.fillStyle='#2f7d6d';ctx.fillRect(x-11,y-12,22,18);ctx.fillStyle='#c58f12';ctx.fillRect(x-11,y,22,4);ctx.fillStyle='#e8c9a0';ctx.fillRect(x-15,y-10,5,12);ctx.fillRect(x+10,y-10,5,12);
ctx.beginPath();ctx.arc(x,y-20,9,0,7);ctx.fill();ctx.fillStyle='#7a4a22';ctx.fillRect(x-9,y-27,18,6);ctx.fillStyle='#000';ctx.fillRect(x-4,y-20,2,2);ctx.fillRect(x+2,y-20,2,2)}
function tp(){mode='panel';$('panel').className='on';let h='<h2>Teleporter</h2><p>Throw the target distance in a world to unlock the next one.</p>';
WD.forEach((w,i)=>{const ok=i==0||S.best[i-1]>=w.need;h+=`<div class="row"><b>${w.n}</b><span>${i==0?'Start':ok?'Unlocked':'Throw '+fmtD(w.need)+' in '+WD[i-1].n+' (best '+fmtD(S.best[i-1])+')'}</span>`+(S.w==i?'<span>You are here</span>':`<button data-go="${i}" ${ok?'':'disabled'}>Go</button>`)+'</div>'});
$('panel').innerHTML=h+'<p><button class="alt" data-close>Close</button></p>'}
